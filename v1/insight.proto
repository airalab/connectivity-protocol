syntax = "proto3";

package sensors.social.v1;

import "common.proto";
import "sensors.proto";

// Insight (indoor) sensor telemetry.
// Designed for indoor environmental monitoring, focusing on
// climate comfort and air quality parameters.

// Insight board sensors.
// Each event carries one sensor-specific payload.
message Insight {
  oneof sensor {
    BME680 bme680 = 1;
    SCD41 scd41 = 2;
    GPS gps = 3;
  }
}

// Protected measurements, encrypted data serialized using this message
message InsightProtected {
  // Protected measurements, used for encryption
  repeated Insight protected = 1;
}

// Insight payload with public/protected data sharing.
message InsightPayload {
  // Public measurements visible to everyone
  repeated Insight public = 1;

  // Protected (encrypted) measurement sections, each for a different recipient
  // Allows sharing different subsets of measurements with different users
  repeated EncryptedData protected = 2;
}
