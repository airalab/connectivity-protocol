syntax = "proto3";

package sensors.social.v1;

message Temperature {
  double celsius = 1;
}

message Pressure {
  double pascal = 1;
}

message Humidity {
  double percent = 1;
}

message CO2 {
  double ppm = 1;
}

message PM25 {
  double ug_m3 = 1;
}

message PM10 {
  double ug_m3 = 1;
}

message NoiseLevel {
  double db = 1;
}

message Radiation {
  double ur_h = 1;
}

message CarbonMonoxide {
  double ppm = 1;
}

message Ozone {
  double ppb = 1;
}

message NitrogenDioxide {
  double ppb = 1;
}

message AirQualityIndex {
  double index = 1;
}
